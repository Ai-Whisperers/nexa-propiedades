name: Deploy
on:
  push:
    branches: [main]
jobs:
  ci:
    uses: Ai-Whisperers/ci-cd/.github/workflows/ci-nextjs.yml@main
    with:
      site-url: 'https://nexa-propiedades.paragu-ai.com'
      package-manager: 'npm'
      node-version: '20'
    secrets: inherit
  deploy:
    needs: ci
    uses: Ai-Whisperers/ci-cd/.github/workflows/deploy-vps.yml@main
    with:
      site-name: 'nexa-propiedades'
      package-manager: 'npm'
      node-version: '20'
    secrets: inherit
